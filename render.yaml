services:
  - type: web
    name: sistema-dentista-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/seed_demo.py --force
    startCommand: gunicorn scripts.run_demo:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
